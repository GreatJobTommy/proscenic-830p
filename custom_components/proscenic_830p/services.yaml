wall_follow:
  name: Wall follow
  description: Start wall-follow (edge) cleaning on the 830P.
  target:
    entity:
      domain: vacuum

single_room:
  name: Single room
  description: Start single-room cleaning.
  target:
    entity:
      domain: vacuum

mop:
  name: Mop
  description: Start mop mode (water tank must be fitted).
  target:
    entity:
      domain: vacuum

remote_control:
  name: Remote control
  description: Direction overlay (forward/turnleft/turnright/stop). Live Kartierung does not send backward.
  target:
    entity:
      domain: vacuum
  fields:
    direction:
      required: true
      example: forward
      selector:
        select:
          options:
            - forward
            - backward
            - turnleft
            - turnright
            - stop

kartierung:
  name: Kartierung
  description: Start bumper occupancy mapping from the dock. No robot camera — the map is the vacuum picture.
  target:
    entity:
      domain: vacuum

stop_kartierung:
  name: Kartierung stoppen
  description: Stop mapping and freeze the occupancy picture on the vacuum.
  target:
    entity:
      domain: vacuum
